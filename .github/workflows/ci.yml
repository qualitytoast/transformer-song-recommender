name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gradient-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify autograd (numerical gradient check)
        run: python test_gradients.py

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-test.txt

      - name: Run pytest (checkpoint, recommender, API) against a fake bundle
        run: pytest -q

  check-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build gradient-check image
        run: docker build -f Dockerfile.check -t song-recommender-check .

      - name: Verify autograd inside the container
        run: docker run --rm song-recommender-check

  serve-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create a fake bundle (CI has no trained weights)
        run: python -m tests.fake_bundle artifacts

      - name: Build serving image
        run: docker build -t song-recommender .

      - name: Start the container and exercise the API
        run: |
          docker run -d --rm -p 7860:7860 --name serve song-recommender
          for i in $(seq 1 30); do
            curl -sf http://localhost:7860/health > /dev/null && break
            sleep 1
          done
          curl -sf http://localhost:7860/health || { docker logs serve; exit 1; }
          echo
          curl -sf -X POST http://localhost:7860/recommend \
            -H 'Content-Type: application/json' \
            -d '{"songs": ["Song 0","Song 1","Song 2","Song 3","Song 4","Song 5","Song 6","Song 7","Song 8","Song 9"], "k": 3}' \
            || { docker logs serve; exit 1; }
          echo
          docker stop serve
