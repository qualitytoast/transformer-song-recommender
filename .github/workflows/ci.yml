name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gradient-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify autograd (numerical gradient check)
        run: python test_gradients.py

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-test.txt

      - name: Run pytest (checkpoint, recommender, API) against a fake bundle
        run: pytest -q

  check-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build gradient-check image
        run: docker build -f Dockerfile.check -t song-recommender-check .

      - name: Verify autograd inside the container
        run: docker run --rm song-recommender-check

  serve-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # artifacts/ is committed, so this builds the same image the host builds,
      # carrying the real trained bundle.
      - name: Build serving image
        run: docker build -t song-recommender .

      - name: Start the container and exercise the API
        run: |
          docker run -d --rm -p 7860:7860 --name serve song-recommender
          for i in $(seq 1 30); do
            curl -sf http://localhost:7860/health > /dev/null && break
            sleep 1
          done
          curl -sf http://localhost:7860/health || { docker logs serve; exit 1; }
          echo
          # Ten real song names, read out of the committed vocab.
          SONGS=$(python -c "import json; v=json.load(open('artifacts/vocab.json')); print(json.dumps(v[:10]))")
          curl -sf -X POST http://localhost:7860/recommend \
            -H 'Content-Type: application/json' \
            -d "{\"songs\": ${SONGS}, \"k\": 3}" \
            || { docker logs serve; exit 1; }
          echo
          docker stop serve
